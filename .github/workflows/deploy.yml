name: Deploy Backend to Production

on:
  workflow_run:
    workflows: [Backend CI]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: production-backend-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: SSH Deploy Backend
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          timeout: 300s
          command_timeout: 20m
          script: |
            # Free safe-to-remove Docker data before the remote deploy script
            # fetches a new Git pack. The script itself is updated only after
            # that fetch succeeds, so this bootstrap cleanup must live here.
            echo "Disk usage before deployment cleanup:"
            df -h / /opt/circle/be /var/lib/docker || true
            df -i / /opt/circle/be /var/lib/docker || true
            docker system df || true
            # Remove all unused Docker objects, but preserve named volumes so
            # PostgreSQL/Redis state survives the deploy.
            docker system prune -af
            find /tmp -xdev -type f -mtime +1 -delete 2>/dev/null || true
            find /var/log -xdev \( -name '*.gz' -o -name '*.1' -o -name '*.old' \) -type f -delete 2>/dev/null || true
            echo "Disk usage after deployment cleanup:"
            df -h / /opt/circle/be /var/lib/docker || true
            cd /opt/circle/be
            origin_url="$(git config --get remote.origin.url)"
            if ! git gc --prune=now; then
              # A full host can prevent Git from writing its temporary pack
              # files. Rebuild only the disposable checkout metadata; .env,
              # Docker volumes, and application files remain untouched.
              rm -rf .git
              git init
              git remote add origin "$origin_url"
              git fetch --depth=1 origin main
              git reset --hard "${{ github.event.workflow_run.head_sha }}"
            fi
            bash /opt/circle/be/deploy.sh "${{ github.event.workflow_run.head_sha }}"
