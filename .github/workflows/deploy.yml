name: Deploy Backend to Production

on:
  workflow_run:
    workflows: [Backend CI]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: production-backend-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: SSH Deploy Backend
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          timeout: 300s
          script: |
            # Free safe-to-remove Docker data before the remote deploy script
            # fetches a new Git pack. The script itself is updated only after
            # that fetch succeeds, so this bootstrap cleanup must live here.
            docker builder prune -af --filter until=168h
            docker image prune -af --filter until=168h
            cd /opt/circle/be
            git gc --prune=now
            bash /opt/circle/be/deploy.sh "${{ github.event.workflow_run.head_sha }}"
