name: Backend CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

jobs:
  quality:
    name: Typecheck, build and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reject tracked runtime environment files
        shell: bash
        run: |
          if git ls-files | grep -E '(^|/)\.env($|\.local$)'; then
            echo 'Runtime environment files must never be committed; use repository secrets or deployment environment variables.' >&2
            exit 1
          fi

      - name: Enforce local-only runtime smoke policy
        shell: bash
        run: |
          bash -n deploy.sh
          if grep -Eq '(^|[[:space:]])curl([[:space:]]|$)|backend smoke check' deploy.sh; then
            echo 'Production deploy scripts must not run runtime smoke checks; use the local smoke harness instead.' >&2
            exit 1
          fi

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.17.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Check types
        run: pnpm check-types

      - name: Build
        run: >-
          pnpm exec turbo run build
          --filter=auth-service...
          --filter=user-service...
          --filter=notification-service...
          --filter=project-service...

      - name: Test
        run: >-
          pnpm exec turbo run test
          --filter=auth-service
          --filter=user-service
          --filter=notification-service
          --filter=project-service

  web-quality:
    name: Web lint and build
    runs-on: ubuntu-latest

    env:
      NEXT_PUBLIC_API_URL: https://pm-api.capylabs.io

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.17.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Lint web
        run: pnpm --filter web lint

      - name: Build web
        run: pnpm --filter web build
